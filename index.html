<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wavelength — international radio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='16' r='2' fill='%23E8A33D'/%3E%3Cpath d='M6 16a6 6 0 0 1 12 0M3 16a9 9 0 0 1 18 0' stroke='%23E8A33D' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141c;
    --panel:#1b1f2a;
    --panel-hover:#232838;
    --amber:#e8a33d;
    --amber-dim:rgba(232,163,61,0.16);
    --green:#6fcf97;
    --danger:#e2725b;
    --paper:#edeae3;
    --muted:#8b90a0;
    --line:rgba(237,234,227,0.09);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    padding-bottom:96px;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  .app{max-width:1080px;margin:0 auto;padding:0 24px;}

  /* ---------- header ---------- */
  .header{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:20px;flex-wrap:wrap;
    padding:32px 0 22px;
    border-bottom:1px solid var(--line);
  }
  .header__mark{font-size:26px;font-weight:700;letter-spacing:-0.02em;display:block;}
  .header__tagline{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);margin-top:4px;display:block;}
  .header__right{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .clock{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--amber);letter-spacing:0.02em;white-space:nowrap;}
  .search input{
    width:240px;max-width:60vw;
    background:var(--panel);border:1px solid var(--line);color:var(--paper);
    padding:9px 14px;border-radius:20px;font-size:14px;
  }
  .search input::placeholder{color:var(--muted);}

  /* ---------- dial ---------- */
  .dial{padding:26px 0 8px;}
  .dial__track{
    position:relative;display:flex;gap:8px;overflow-x:auto;
    padding-bottom:14px;scrollbar-width:none;
  }
  .dial__track::-webkit-scrollbar{display:none;}
  .dial__btn{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:8px 16px;border-radius:20px;font-size:14px;font-weight:500;
    white-space:nowrap;transition:color .15s ease,border-color .15s ease;
  }
  .dial__btn:hover{color:var(--paper);border-color:rgba(237,234,227,0.25);}
  .dial__btn.is-active{color:var(--ink);background:var(--amber);border-color:var(--amber);}
  .dial__ruler{height:1px;background:var(--line);position:relative;margin-bottom:16px;}
  .dial__ruler span{
    position:absolute;top:-3px;width:7px;height:7px;border-radius:50%;
    background:var(--amber);transform:translateX(-50%);
    transition:left .28s cubic-bezier(.4,0,.2,1);
  }
  .dial__countries{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:6px;min-height:34px;}
  .pill{
    background:var(--panel);border:1px solid transparent;color:var(--muted);
    padding:6px 13px;border-radius:16px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;
    transition:color .15s ease,background .15s ease;
  }
  .pill:hover{color:var(--paper);background:var(--panel-hover);}
  .pill.is-active{color:var(--amber);background:var(--amber-dim);}

  /* ---------- stations ---------- */
  .stations{padding:20px 0 40px;}
  .stations__head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;}
  .stations__head h2{font-size:19px;font-weight:600;margin:0;}
  .stations__count{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}

  .load-more-wrap{display:flex;justify-content:center;margin-top:22px;}
  .load-more-wrap.is-hidden{display:none;}
  .load-more-btn{
    background:none;border:1px solid var(--line);color:var(--muted);
    padding:9px 22px;border-radius:20px;font-size:13px;font-family:'IBM Plex Mono',monospace;
    transition:color .15s ease,border-color .15s ease;
  }
  .load-more-btn:hover:not(:disabled){color:var(--amber);border-color:var(--amber);}
  .load-more-btn:disabled{opacity:.5;cursor:default;}

  .card{
    background:var(--panel);border:1px solid transparent;border-left:2px solid transparent;
    border-radius:var(--radius);padding:14px;display:flex;gap:12px;align-items:flex-start;
    transition:background .15s ease,border-color .15s ease;text-align:left;width:100%;color:inherit;
  }
  .card:hover{background:var(--panel-hover);}
  .card.is-playing{border-left-color:var(--amber);background:var(--panel-hover);}
  .card__icon{
    width:40px;height:40px;border-radius:8px;background:var(--ink);flex:none;
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  }
  .card__icon-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .card__icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .card__body{min-width:0;flex:1;}
  .card__name{font-size:14.5px;font-weight:500;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card__meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);margin-top:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card__tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .card__tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);
    border:1px solid var(--line);border-radius:10px;padding:2px 8px;background:none;
    transition:color .15s ease,border-color .15s ease;}
  .card__tag:hover{color:var(--amber);border-color:var(--amber);}
  .card__star{background:none;border:none;color:var(--muted);font-size:16px;flex:none;padding:2px;line-height:1;}
  .card__star.is-fav{color:var(--amber);}

  .empty,.retry-msg{
    grid-column:1/-1;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--muted);
    padding:30px 0;
  }
  .retry-msg button{margin-left:10px;background:none;border:1px solid var(--line);color:var(--amber);
    padding:4px 12px;border-radius:14px;font-size:12.5px;}

  .skeleton{background:var(--panel);border-radius:var(--radius);height:70px;}
  @media (prefers-reduced-motion:no-preference){
    .skeleton{
      background:linear-gradient(90deg,var(--panel) 25%,var(--panel-hover) 37%,var(--panel) 63%);
      background-size:400% 100%;animation:shimmer 1.6s ease infinite;
    }
    @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
  }

  /* ---------- footer ---------- */
  .footer{
    border-top:1px solid var(--line);padding:20px 0 40px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }

  /* ---------- player ---------- */
  .player{
    position:fixed;left:0;right:0;bottom:0;background:#0d0f15;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:12px 20px;z-index:10;
  }
  .player__scan,.player__play,.player__fav{
    background:none;border:1px solid var(--line);color:var(--paper);border-radius:50%;
    width:38px;height:38px;flex:none;font-size:15px;display:flex;align-items:center;justify-content:center;
  }
  .player__play{background:var(--amber);color:var(--ink);border-color:var(--amber);width:42px;height:42px;font-size:16px;}
  .player__fav.is-fav{color:var(--amber);border-color:var(--amber);}
  .player__info{min-width:0;flex:1;}
  .player__name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .player__meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
  .player__onair{display:none;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--green);flex:none;}
  .player__onair span{width:7px;height:7px;border-radius:50%;background:var(--green);}
  .player.is-live .player__onair{display:flex;}
  @media (prefers-reduced-motion:no-preference){
    .player.is-live .player__onair span{animation:pulse 1.4s ease infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  }
  .player__volume{width:90px;accent-color:var(--amber);flex:none;}
  @media (max-width:640px){
    .player__meta,.player__volume{display:none;}
    .header__tagline{display:none;}
  }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:90px;transform:translate(-50%,12px);
    background:var(--panel);border:1px solid var(--line);color:var(--paper);
    padding:10px 18px;border-radius:20px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:20;
    max-width:80vw;text-align:center;
  }
  .toast.is-visible{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div>
      <span class="header__mark">Wavelength</span>
      <span class="header__tagline">Live radio from every timezone</span>
    </div>
    <div class="header__right">
      <div class="clock" id="clock">--:--:-- UTC</div>
      <div class="search">
        <input id="searchInput" type="text" placeholder="Search a station, city, or genre" autocomplete="off" />
      </div>
    </div>
  </header>

  <section class="dial" aria-label="Tune by region">
    <div class="dial__track" id="dialTrack"></div>
    <div class="dial__ruler"><span id="dialNeedle"></span></div>
    <div class="dial__countries" id="countryRow"></div>
  </section>

  <main class="stations">
    <div class="stations__head">
      <h2 id="stationsTitle">Popular around the world</h2>
      <span class="stations__count" id="stationsCount"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="load-more-wrap is-hidden" id="loadMoreWrap">
      <button class="load-more-btn" id="loadMoreBtn" type="button">Load more stations</button>
    </div>
  </main>

  <footer class="footer">
    <span>Station data from the Radio Browser community project.</span>
    <span>Signals come and go — if one drops, tune to another.</span>
  </footer>
</div>

<div class="player" id="player">
  <button class="player__scan" id="scanBtn" title="Scan for a random station">⟲</button>
  <button class="player__play" id="playBtn" aria-label="Play">▶</button>
  <div class="player__info">
    <div class="player__name" id="nowName">Nothing tuned in yet</div>
    <div class="player__meta" id="nowMeta">Pick a station below to start listening</div>
  </div>
  <div class="player__onair" id="onair"><span></span>On air</div>
  <button class="player__fav" id="favBtn" aria-label="Save favorite" disabled>☆</button>
  <input class="player__volume" id="volume" type="range" min="0" max="100" value="80" aria-label="Volume" />
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="none"></audio>

<script>
(function(){
  "use strict";

  var MIRRORS = [
    "https://de1.api.radio-browser.info",
    "https://de2.api.radio-browser.info",
    "https://nl1.api.radio-browser.info",
    "https://fi1.api.radio-browser.info"
  ];

  var CONTINENTS = {
    "Europe": ["Albania","Andorra","Austria","Belarus","Belgium","Bosnia and Herzegovina","Bulgaria","Croatia","Cyprus","Czechia","Czech Republic","Denmark","Estonia","Finland","France","Germany","Greece","Hungary","Iceland","Ireland","Italy","Kosovo","Latvia","Liechtenstein","Lithuania","Luxembourg","Malta","Moldova","Monaco","Montenegro","Netherlands","North Macedonia","Norway","Poland","Portugal","Romania","Russia","Russian Federation","San Marino","Serbia","Slovakia","Slovenia","Spain","Sweden","Switzerland","Ukraine","United Kingdom"],
    "Asia": ["Afghanistan","Armenia","Azerbaijan","Bangladesh","Bhutan","Brunei","Cambodia","China","Georgia","Hong Kong","India","Indonesia","Japan","Kazakhstan","Kyrgyzstan","Laos","Macau","Malaysia","Maldives","Mongolia","Myanmar","Nepal","North Korea","Pakistan","Philippines","Singapore","South Korea","Sri Lanka","Taiwan","Tajikistan","Thailand","Timor-Leste","Turkmenistan","Uzbekistan","Vietnam"],
    "Africa": ["Algeria","Angola","Benin","Botswana","Burkina Faso","Burundi","Cameroon","Cape Verde","Chad","Congo","Democratic Republic of the Congo","Djibouti","Egypt","Equatorial Guinea","Eritrea","Eswatini","Ethiopia","Gabon","Gambia","Ghana","Guinea","Ivory Coast","Kenya","Lesotho","Liberia","Libya","Madagascar","Malawi","Mali","Mauritania","Mauritius","Morocco","Mozambique","Namibia","Niger","Nigeria","Rwanda","Senegal","Sierra Leone","Somalia","South Africa","South Sudan","Sudan","Tanzania","Togo","Tunisia","Uganda","Zambia","Zimbabwe"],
    "Middle East": ["Bahrain","Iran","Iraq","Israel","Jordan","Kuwait","Lebanon","Oman","Palestine","Qatar","Saudi Arabia","Syria","Turkey","United Arab Emirates","Yemen"],
    "North America": ["Canada","United States","Mexico","Belize","Costa Rica","Cuba","Dominican Republic","El Salvador","Guatemala","Haiti","Honduras","Jamaica","Nicaragua","Panama","Trinidad and Tobago","Bahamas","Barbados"],
    "South America": ["Argentina","Bolivia","Brazil","Chile","Colombia","Ecuador","Guyana","Paraguay","Peru","Suriname","Uruguay","Venezuela"],
    "Oceania": ["Australia","New Zealand","Fiji","Papua New Guinea","Samoa","Tonga","Vanuatu","Solomon Islands","New Caledonia","French Polynesia"]
  };
  var TABS = ["Popular","Favorites","Europe","Asia","Africa","Middle East","North America","South America","Oceania"];

  var el = {
    dialTrack: document.getElementById("dialTrack"),
    dialNeedle: document.getElementById("dialNeedle"),
    countryRow: document.getElementById("countryRow"),
    grid: document.getElementById("grid"),
    title: document.getElementById("stationsTitle"),
    count: document.getElementById("stationsCount"),
    search: document.getElementById("searchInput"),
    clock: document.getElementById("clock"),
    player: document.getElementById("player"),
    playBtn: document.getElementById("playBtn"),
    scanBtn: document.getElementById("scanBtn"),
    favBtn: document.getElementById("favBtn"),
    volume: document.getElementById("volume"),
    nowName: document.getElementById("nowName"),
    nowMeta: document.getElementById("nowMeta"),
    audio: document.getElementById("audio"),
    toast: document.getElementById("toast"),
    loadMoreBtn: document.getElementById("loadMoreBtn"),
    loadMoreWrap: document.getElementById("loadMoreWrap")
  };

  var PAGE_SIZE = 40;

  var state = {
    activeTab: "Popular",
    countries: [],
    countriesLoaded: false,
    favorites: [],
    current: null,
    isPlaying: false,
    lastNonSearchTab: "Popular",
    toastTimer: null,
    view: "popular",
    viewParam: null,
    offset: 0,
    searchLimit: PAGE_SIZE,
    renderedUUIDs: new Set()
  };

  /* ---------------- API helper ---------------- */
  function shuffled(list){
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function apiGet(path){
    var mirrors = shuffled(MIRRORS);
    var i = 0;
    function tryNext(){
      if (i >= mirrors.length) return Promise.reject(new Error("all mirrors failed"));
      var base = mirrors[i++];
      var ctrl = new AbortController();
      var timer = setTimeout(function(){ ctrl.abort(); }, 6000);
      return fetch(base + path, { signal: ctrl.signal }).then(function(res){
        clearTimeout(timer);
        if (!res.ok) throw new Error("bad status " + res.status);
        return res.json();
      }).catch(function(err){
        clearTimeout(timer);
        return tryNext();
      });
    }
    return tryNext();
  }

  /* ---------------- storage ---------------- */
  function loadFavorites(){
    if (!window.storage) return Promise.resolve();
    return window.storage.get("favorites", false).then(function(res){
      if (res && res.value){
        try { state.favorites = JSON.parse(res.value) || []; } catch(e){ state.favorites = []; }
      }
    }).catch(function(){ /* no favorites saved yet */ });
  }
  function saveFavorites(){
    if (!window.storage) return;
    window.storage.set("favorites", JSON.stringify(state.favorites), false).catch(function(){});
  }
  function isFavorite(uuid){
    return state.favorites.some(function(s){ return s.stationuuid === uuid; });
  }
  function toggleFavorite(station){
    if (isFavorite(station.stationuuid)){
      state.favorites = state.favorites.filter(function(s){ return s.stationuuid !== station.stationuuid; });
    } else {
      state.favorites.push(station);
    }
    saveFavorites();
    updateFavButton();
    if (state.activeTab === "Favorites") renderGrid(state.favorites);
  }

  /* ---------------- toast ---------------- */
  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add("is-visible");
    if (state.toastTimer) clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(function(){ el.toast.classList.remove("is-visible"); }, 3500);
  }

  /* ---------------- clock ---------------- */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function tickClock(){
    var d = new Date();
    el.clock.textContent = pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" + pad(d.getUTCSeconds()) + " UTC";
  }

  /* ---------------- rendering: dial ---------------- */
  function renderTabs(){
    el.dialTrack.innerHTML = "";
    TABS.forEach(function(tab){
      var btn = document.createElement("button");
      btn.className = "dial__btn" + (tab === state.activeTab ? " is-active" : "");
      btn.textContent = tab;
      btn.setAttribute("data-tab", tab);
      btn.addEventListener("click", function(){ selectTab(tab); });
      el.dialTrack.appendChild(btn);
    });
    positionNeedle();
  }
  function positionNeedle(){
    var active = el.dialTrack.querySelector(".is-active");
    if (!active) return;
    var left = active.offsetLeft + active.offsetWidth / 2;
    el.dialNeedle.style.left = left + "px";
  }

  function renderCountryPills(list, selected){
    el.countryRow.innerHTML = "";
    list.forEach(function(c){
      var btn = document.createElement("button");
      btn.className = "pill" + (c.name === selected ? " is-active" : "");
      btn.textContent = c.name + " (" + c.stationcount + ")";
      btn.addEventListener("click", function(){
        Array.prototype.forEach.call(el.countryRow.children, function(p){ p.classList.remove("is-active"); });
        btn.classList.add("is-active");
        loadCountry(c.name);
      });
      el.countryRow.appendChild(btn);
    });
  }

  /* ---------------- rendering: grid ---------------- */
  function showSkeletons(n){
    el.grid.innerHTML = "";
    el.count.textContent = "";
    for (var i = 0; i < n; i++){
      var s = document.createElement("div");
      s.className = "skeleton";
      el.grid.appendChild(s);
    }
  }

  function capitalize(word){
    return word.length ? word.charAt(0).toUpperCase() + word.slice(1) : word;
  }

  function makeCard(station){
    var card = document.createElement("button");
    card.className = "card" + (state.current && state.current.stationuuid === station.stationuuid ? " is-playing" : "");
    card.type = "button";

    var icon = document.createElement("div");
    icon.className = "card__icon";
    var fallback = document.createElement("div");
    fallback.className = "card__icon-fallback";
    fallback.innerHTML = "<svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.6'><circle cx='12' cy='16' r='1.6' fill='currentColor' stroke='none'/><path d='M6 16a6 6 0 0 1 12 0M3 16a9 9 0 0 1 18 0' stroke-linecap='round'/></svg>";
    icon.appendChild(fallback);
    if (station.favicon){
      var img = document.createElement("img");
      img.src = station.favicon;
      img.alt = "";
      img.onerror = function(){ img.style.display = "none"; };
      icon.appendChild(img);
    }

    var body = document.createElement("div");
    body.className = "card__body";
    var name = document.createElement("div");
    name.className = "card__name";
    name.textContent = station.name || "Unnamed station";
    var meta = document.createElement("div");
    meta.className = "card__meta";
    var metaBits = [];
    if (station.country) metaBits.push(station.country);
    if (station.bitrate) metaBits.push(station.bitrate + " kbps");
    meta.textContent = metaBits.join(" · ");
    body.appendChild(name);
    body.appendChild(meta);

    if (station.tags){
      var tagRow = document.createElement("div");
      tagRow.className = "card__tags";
      station.tags.split(",").map(function(t){ return t.trim(); }).filter(Boolean).slice(0, 2).forEach(function(t){
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "card__tag";
        chip.textContent = capitalize(t);
        chip.setAttribute("data-role", "tag");
        chip.setAttribute("data-tag", t);
        tagRow.appendChild(chip);
      });
      body.appendChild(tagRow);
    }

    var star = document.createElement("span");
    star.className = "card__star" + (isFavorite(station.stationuuid) ? " is-fav" : "");
    star.textContent = isFavorite(station.stationuuid) ? "★" : "☆";
    star.setAttribute("data-role", "star");

    card.appendChild(icon);
    card.appendChild(body);
    card.appendChild(star);

    card.addEventListener("click", function(e){
      var role = e.target && e.target.getAttribute && e.target.getAttribute("data-role");
      if (role === "star"){
        e.stopPropagation();
        toggleFavorite(station);
        star.classList.toggle("is-fav");
        star.textContent = star.classList.contains("is-fav") ? "★" : "☆";
        return;
      }
      if (role === "tag"){
        e.stopPropagation();
        enterSearchMode(e.target.getAttribute("data-tag"));
        return;
      }
      playStation(station);
    });

    return card;
  }

  function resetGrid(){
    el.grid.innerHTML = "";
    state.renderedUUIDs = new Set();
  }

  function updateCountText(){
    var n = state.renderedUUIDs.size;
    el.count.textContent = n ? n + " station" + (n === 1 ? "" : "s") : "";
  }

  function appendCards(list){
    var added = 0;
    (list || []).forEach(function(s){
      if (!s || !s.stationuuid || state.renderedUUIDs.has(s.stationuuid)) return;
      state.renderedUUIDs.add(s.stationuuid);
      el.grid.appendChild(makeCard(s));
      added++;
    });
    updateCountText();
    return added;
  }

  function maybeShowEmpty(){
    if (state.renderedUUIDs.size === 0){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No stations on this frequency. Try a different search or region.";
      el.grid.appendChild(empty);
    }
  }

  function toggleLoadMore(show){
    el.loadMoreWrap.classList.toggle("is-hidden", !show);
    el.loadMoreBtn.disabled = false;
    el.loadMoreBtn.textContent = "Load more stations";
  }

  function renderGrid(stations){
    resetGrid();
    appendCards(stations);
    toggleLoadMore(false);
    maybeShowEmpty();
  }

  function renderFailure(){
    el.grid.innerHTML = "";
    el.count.textContent = "";
    var wrap = document.createElement("div");
    wrap.className = "retry-msg";
    wrap.textContent = "Couldn't reach the station directory.";
    var btn = document.createElement("button");
    btn.textContent = "Try again";
    btn.addEventListener("click", function(){ selectTab(state.activeTab); });
    wrap.appendChild(btn);
    el.grid.appendChild(wrap);
  }

  /* ---------------- data loading ---------------- */
  function loadPopular(reset){
    state.view = "popular";
    state.viewParam = null;
    el.title.textContent = "Popular around the world";
    if (reset !== false){
      resetGrid();
      state.offset = 0;
      showSkeletons(8);
    } else {
      el.loadMoreBtn.disabled = true;
      el.loadMoreBtn.textContent = "Loading…";
    }
    apiGet("/json/stations/search?order=votes&reverse=true&limit=" + PAGE_SIZE + "&offset=" + state.offset + "&hidebroken=true")
      .then(function(list){
        if (reset !== false) el.grid.innerHTML = "";
        appendCards(list);
        state.offset += list.length;
        maybeShowEmpty();
        toggleLoadMore(list.length === PAGE_SIZE);
      })
      .catch(function(){
        if (reset !== false){ renderFailure(); }
        else { showToast("Couldn't reach the station directory."); toggleLoadMore(true); }
      });
  }

  function loadFavoritesTab(){
    state.view = "favorites";
    state.viewParam = null;
    el.title.textContent = "Your favorites";
    renderGrid(state.favorites);
  }

  function ensureCountries(){
    if (state.countriesLoaded) return Promise.resolve(state.countries);
    return apiGet("/json/countries?order=stationcount&reverse=true").then(function(list){
      state.countries = list || [];
      state.countriesLoaded = true;
      return state.countries;
    });
  }

  function loadContinent(name){
    el.title.textContent = name + " stations";
    el.countryRow.innerHTML = "";
    showSkeletons(8);
    ensureCountries().then(function(countries){
      var names = CONTINENTS[name] || [];
      var matches = countries.filter(function(c){
        return names.indexOf(c.name) !== -1 && c.stationcount > 0;
      }).sort(function(a, b){ return b.stationcount - a.stationcount; }).slice(0, 30);
      if (!matches.length){
        renderGrid([]);
        return;
      }
      renderCountryPills(matches, matches[0].name);
      loadCountry(matches[0].name, true);
    }).catch(function(){ renderFailure(); });
  }

  function loadCountry(name, reset){
    state.view = "country";
    state.viewParam = name;
    el.title.textContent = name + " stations";
    if (reset !== false){
      resetGrid();
      state.offset = 0;
      showSkeletons(8);
    } else {
      el.loadMoreBtn.disabled = true;
      el.loadMoreBtn.textContent = "Loading…";
    }
    apiGet("/json/stations/search?countryExact=" + encodeURIComponent(name) + "&order=clickcount&reverse=true&limit=" + PAGE_SIZE + "&offset=" + state.offset + "&hidebroken=true")
      .then(function(list){
        if (reset !== false) el.grid.innerHTML = "";
        appendCards(list);
        state.offset += list.length;
        maybeShowEmpty();
        toggleLoadMore(list.length === PAGE_SIZE);
      })
      .catch(function(){
        if (reset !== false){ renderFailure(); }
        else { showToast("Couldn't reach the station directory."); toggleLoadMore(true); }
      });
  }

  function fetchSearchBatch(query, limit){
    var qEnc = encodeURIComponent(query);
    var subLimit = Math.max(10, Math.round(limit / 2));
    var reqs = [
      apiGet("/json/stations/search?name=" + qEnc + "&limit=" + limit + "&hidebroken=true&order=votes&reverse=true").catch(function(){ return []; }),
      apiGet("/json/stations/search?tag=" + qEnc + "&limit=" + limit + "&hidebroken=true&order=votes&reverse=true").catch(function(){ return []; }),
      apiGet("/json/stations/search?country=" + qEnc + "&limit=" + subLimit + "&hidebroken=true&order=votes&reverse=true").catch(function(){ return []; }),
      apiGet("/json/stations/search?language=" + qEnc + "&limit=" + subLimit + "&hidebroken=true&order=votes&reverse=true").catch(function(){ return []; })
    ];
    return Promise.all(reqs).then(function(results){
      var merged = new Map();
      results.forEach(function(list){
        (list || []).forEach(function(s){
          if (s && s.stationuuid && !merged.has(s.stationuuid)) merged.set(s.stationuuid, s);
        });
      });
      var arr = Array.from(merged.values());
      arr.sort(function(a, b){ return (b.votes || 0) - (a.votes || 0); });
      return arr;
    });
  }

  function runSearch(query, isLoadMore){
    state.view = "search";
    state.viewParam = query;
    el.title.textContent = 'Results for "' + query + '"';
    if (!isLoadMore){
      resetGrid();
      state.searchLimit = PAGE_SIZE;
      showSkeletons(8);
    } else {
      state.searchLimit += PAGE_SIZE;
      el.loadMoreBtn.disabled = true;
      el.loadMoreBtn.textContent = "Loading…";
    }
    var before = state.renderedUUIDs.size;
    fetchSearchBatch(query, state.searchLimit).then(function(list){
      if (!isLoadMore) el.grid.innerHTML = "";
      appendCards(list);
      maybeShowEmpty();
      var after = state.renderedUUIDs.size;
      if (isLoadMore && after === before){
        toggleLoadMore(false);
        showToast("No more stations found for this search.");
      } else {
        toggleLoadMore(true);
      }
    }).catch(function(){
      if (!isLoadMore){ renderFailure(); }
      else { showToast("Couldn't reach the station directory."); toggleLoadMore(true); }
    });
  }

  function enterSearchMode(query){
    el.search.value = query;
    el.countryRow.innerHTML = "";
    Array.prototype.forEach.call(el.dialTrack.children, function(b){ b.classList.remove("is-active"); });
    runSearch(query, false);
  }

  /* ---------------- tab selection ---------------- */
  function selectTab(tab){
    state.activeTab = tab;
    state.lastNonSearchTab = tab;
    el.search.value = "";
    Array.prototype.forEach.call(el.dialTrack.children, function(b){
      b.classList.toggle("is-active", b.getAttribute("data-tab") === tab);
    });
    positionNeedle();
    if (tab === "Popular"){
      el.countryRow.innerHTML = "";
      loadPopular();
    } else if (tab === "Favorites"){
      el.countryRow.innerHTML = "";
      loadFavoritesTab();
    } else {
      loadContinent(tab);
    }
  }

  /* ---------------- playback ---------------- */
  function updateFavButton(){
    if (!state.current){
      el.favBtn.disabled = true;
      el.favBtn.classList.remove("is-fav");
      el.favBtn.textContent = "☆";
      return;
    }
    el.favBtn.disabled = false;
    var fav = isFavorite(state.current.stationuuid);
    el.favBtn.classList.toggle("is-fav", fav);
    el.favBtn.textContent = fav ? "★" : "☆";
  }

  function setNowPlayingUI(station, statusText){
    el.nowName.textContent = station.name || "Unnamed station";
    el.nowMeta.textContent = statusText || [station.country, station.bitrate ? station.bitrate + " kbps" : ""].filter(Boolean).join(" · ");
  }

  function playStation(station){
    state.current = station;
    setNowPlayingUI(station, "Tuning in…");
    updateFavButton();
    el.player.classList.remove("is-live");
    refreshCardHighlight();

    apiGet("/json/url/" + encodeURIComponent(station.stationuuid))
      .then(function(res){
        return (res && (res.url || res.url_resolved)) || station.url_resolved || station.url;
      })
      .catch(function(){ return station.url_resolved || station.url; })
      .then(function(streamUrl){
        if (!streamUrl){ throw new Error("no stream url"); }
        el.audio.src = streamUrl;
        return el.audio.play();
      })
      .then(function(){
        state.isPlaying = true;
        el.playBtn.textContent = "❚❚";
        el.player.classList.add("is-live");
        setNowPlayingUI(station);
      })
      .catch(function(){
        state.isPlaying = false;
        el.playBtn.textContent = "▶";
        showToast("This signal dropped. Try another frequency.");
        setNowPlayingUI(station, "Unavailable right now");
      });
  }

  function refreshCardHighlight(){
    Array.prototype.forEach.call(el.grid.children, function(card){ card.classList.remove("is-playing"); });
  }

  function togglePlayback(){
    if (!state.current) return;
    if (state.isPlaying){
      el.audio.pause();
      state.isPlaying = false;
      el.playBtn.textContent = "▶";
      el.player.classList.remove("is-live");
    } else if (el.audio.src){
      el.audio.play().then(function(){
        state.isPlaying = true;
        el.playBtn.textContent = "❚❚";
        el.player.classList.add("is-live");
      }).catch(function(){
        showToast("This signal dropped. Try another frequency.");
      });
    } else {
      playStation(state.current);
    }
  }

  function scanRandom(){
    el.nowMeta.textContent = "Scanning…";
    apiGet("/json/stations/search?limit=1&hidebroken=true&order=random")
      .then(function(list){
        if (list && list[0]) playStation(list[0]);
        else showToast("Couldn't find a station to scan to.");
      })
      .catch(function(){ showToast("Couldn't reach the station directory."); });
  }

  /* ---------------- events ---------------- */
  el.playBtn.addEventListener("click", togglePlayback);
  el.scanBtn.addEventListener("click", scanRandom);
  el.favBtn.addEventListener("click", function(){
    if (state.current) toggleFavorite(state.current);
  });
  el.volume.addEventListener("input", function(){
    el.audio.volume = Number(el.volume.value) / 100;
  });
  el.loadMoreBtn.addEventListener("click", function(){
    if (state.view === "popular") loadPopular(false);
    else if (state.view === "country") loadCountry(state.viewParam, false);
    else if (state.view === "search") runSearch(state.viewParam, true);
  });
  el.audio.volume = Number(el.volume.value) / 100;
  el.audio.addEventListener("error", function(){
    if (state.current){
      showToast("This signal dropped. Try another frequency.");
      state.isPlaying = false;
      el.playBtn.textContent = "▶";
      el.player.classList.remove("is-live");
    }
  });

  var searchTimer = null;
  el.search.addEventListener("input", function(){
    var q = el.search.value.trim();
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      if (q.length >= 2){
        el.countryRow.innerHTML = "";
        Array.prototype.forEach.call(el.dialTrack.children, function(b){ b.classList.remove("is-active"); });
        runSearch(q, false);
      } else if (q.length === 0){
        selectTab(state.lastNonSearchTab);
      }
    }, 350);
  });

  window.addEventListener("resize", positionNeedle);

  /* ---------------- init ---------------- */
  tickClock();
  setInterval(tickClock, 1000);
  renderTabs();
  loadFavorites().then(function(){
    loadPopular();
  });
})();
</script>
</body>
</html>
